<script>
(function () {
  var root = document.currentScript.closest('.pv-road');
  if (!root) return;
  var card = root.querySelector('.pv-card');
  var all = root.querySelector('.pv-all');
  var pinned = null;
  var SEL = '.pv-bar, .pv-ms';

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function setGroup(btn, open) {
    var g = btn.getAttribute('data-g');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    root.querySelectorAll('[data-row="' + g + '"]').forEach(function (n) { n.hidden = !open; });
    root.querySelectorAll('[data-sum="' + g + '"]').forEach(function (n) { n.hidden = open; });
  }
  function syncAll() {
    var anyOpen = Array.prototype.some.call(root.querySelectorAll('.pv-toggle'), function (b) {
      return b.getAttribute('aria-expanded') === 'true';
    });
    all.textContent = anyOpen ? 'Collapse All' : 'Expand All';
    all.setAttribute('aria-pressed', anyOpen ? 'false' : 'true');
  }
  root.querySelectorAll('.pv-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setGroup(btn, btn.getAttribute('aria-expanded') !== 'true');
      syncAll();
      hide(true);
    });
  });
  all.addEventListener('click', function () {
    var open = all.textContent === 'Expand All';
    root.querySelectorAll('.pv-toggle').forEach(function (b) { setGroup(b, open); });
    syncAll();
    hide(true);
  });

  function show(t) {
    var d = t.dataset;
    if (!d.t) return;
    card.innerHTML = '';
    card.appendChild(el('b', null, d.t));
    card.appendChild(el('div', 'pv-meta', d.m));
    if (d.d) card.appendChild(el('p', null, d.d));
    var dl = el('dl');
    [['Section', d.s], ['Ends with', d.x], ['Owner', d.o]].forEach(function (r) {
      if (!r[1]) return;
      dl.appendChild(el('dt', null, r[0]));
      dl.appendChild(el('dd', null, r[1]));
    });
    if (dl.childNodes.length) card.appendChild(dl);
    card.hidden = false;
    var fr = root.getBoundingClientRect(), br = t.getBoundingClientRect();
    var max = fr.width - card.offsetWidth - 8;
    card.style.left = Math.max(8, Math.min(br.left - fr.left, max)) + 'px';
    card.style.top = (br.bottom - fr.top + 10) + 'px';
    root.querySelectorAll('.is-on').forEach(function (n) { n.classList.remove('is-on'); });
    t.classList.add('is-on');
  }
  function hide(force) {
    if (pinned && !force) return;
    pinned = null;
    card.hidden = true;
    root.querySelectorAll('.is-on').forEach(function (n) { n.classList.remove('is-on'); });
  }
  root.addEventListener('pointerover', function (ev) {
    var t = ev.target.closest(SEL);
    if (t && !pinned && ev.pointerType === 'mouse') show(t);
  });
  root.addEventListener('pointerout', function (ev) {
    var t = ev.target.closest(SEL);
    if (t && ev.pointerType === 'mouse') hide(false);
  });
  root.addEventListener('click', function (ev) {
    var t = ev.target.closest(SEL);
    if (!t) { if (!ev.target.closest('.pv-card')) hide(true); return; }
    if (pinned === t) { hide(true); return; }
    pinned = t;
    show(t);
  });
  root.addEventListener('focusin', function (ev) { var t = ev.target.closest(SEL); if (t) show(t); });
  root.addEventListener('focusout', function (ev) { var t = ev.target.closest(SEL); if (t && pinned !== t) hide(false); });
  root.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') hide(true); });
  root.querySelector('.pv-scroll').addEventListener('scroll', function () { hide(true); }, { passive: true });
})();
</script>
