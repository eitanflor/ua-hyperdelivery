<style>
.pv-uc { --bg: #ffffff; --surface: #f9f9f9; --ink: #1d1d1d; --muted: #5f5f5f; --line: #e6e6e6; --control: #8a8a8a;

  line-height: 1.35; color: var(--ink); }
.pv-uc * { box-sizing: border-box; }
.pv-uc .pv-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  border-top: 2px solid var(--ink); padding-top: 12px; margin-bottom: 12px; }
.pv-uc .pv-title { font-weight: 700; font-size: 15px; margin: 0; }
.pv-uc .uc-only { font: inherit; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 6px;

  font-weight: 600; cursor: pointer; }
.pv-uc .uc-only:hover { border-color: var(--control); }
.pv-uc .uc-sw { position: relative; width: 28px; height: 16px; border-radius: 999px; background: #d4d4d4; flex: 0 0 auto; }
.pv-uc .uc-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: #ffffff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
.pv-uc .uc-only[aria-pressed="true"] .uc-sw { background: var(--ink); }
.pv-uc .uc-only[aria-pressed="true"] .uc-sw::after { left: 14px; }
.pv-uc .uc-key { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
.pv-uc .uc-key span { display: inline-flex; align-items: center; gap: 8px; }
.pv-uc .uc-key b { color: var(--ink); font-weight: 700; }
.pv-uc .uc-key .k-works { color: var(--ink); font-weight: 600; }
.pv-uc .uc-box { overflow: auto; max-height: 80vh; overscroll-behavior: contain; border: 1px solid var(--line); border-radius: 8px; }
.pv-uc .uc-box:focus-visible, .pv-uc .uc-only:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.pv-uc table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 740px; table-layout: fixed; }
.pv-uc col.uc-c0 { width: 196px; }
.pv-uc col.uc-chd { width: 82px; }
.pv-uc thead th { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--ink);
  padding: 10px 3px 8px; vertical-align: bottom; font-weight: 600; }
.pv-uc .uc-th { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-stretch: 90%;
  line-height: 1.15; text-align: center; color: var(--ink); }
.pv-uc thead th.uc-corner { left: 0; z-index: 4; text-align: left; padding-left: 12px; font-size: 11px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pv-uc tbody th { position: sticky; left: 0; z-index: 1; background: var(--bg); text-align: left; font-size: 12.5px;
  font-weight: 500; line-height: 1.3; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.pv-uc thead th.uc-corner, .pv-uc tbody th { box-shadow: inset -1px 0 0 var(--line); }
.pv-uc td { text-align: center; vertical-align: middle; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.pv-uc tbody tr:last-child > * { border-bottom: 0; }
.pv-uc tbody tr:hover > th, .pv-uc tbody tr:hover > td { background: #f7f7f7; }
.pv-uc tbody tr:hover > td.hd { background: #efefef; }
.pv-uc .hd { background: #f4f4f4; }
.pv-uc thead th.hd { background: #f4f4f4; border-bottom: 2px solid var(--ink); }
.pv-uc thead th.hd .uc-th { font-weight: 700; }
.pv-uc .mk { display: block; margin: 0 auto 5px; }
.pv-uc td.best .mk { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }
.pv-uc td.works .mk { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); }
.pv-uc td.no .mk { width: 10px; height: 2px; margin: 5px auto 10px; background: #bdbdbd; border-radius: 1px; }

.pv-uc td.no .tx { color: #6b6b6b; }
.pv-uc .uc-key .mk { margin: 0; display: inline-block; }
.pv-uc .uc-key .mk.best { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); }
.pv-uc .uc-key .mk.works { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); }
.pv-uc .uc-key .mk.no { width: 10px; height: 2px; background: #bdbdbd; }
.pv-uc tr[hidden] { display: none; }
.pv-uc .uc-foot { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
.pv-uc .lg { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
