<style>

.pv-tm .tm-yt { position: sticky; left: 0; }
.pv-tm .tm-cell { background: var(--surface); border-radius: 8px; padding: 8px; min-height: 72px;

.pv-tm .tm-cell.is-empty { background: #fcfcfc; box-shadow: inset 0 0 0 1px #efefef; }
