d them; the model never sees one.","identity":"Read by the broker and build worker roles only","logo":"amazonwebservices","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"api","name":"Console API","sub":"FastAPI, Entra token","zone":"ctl","x":32,"y":176,"w":112,"h":40,"what":"Validates the Entra token, serves the console, starts work, checks the signer matrix and records each signature before the gate is released.","identity":"Service role per environment","phase":"today","phaseText":"From today"},{"id":"sfn","name":"Step Functions","sub":"the line, three approvals","zone":"ctl","x":208,"y":176,"w":128,"h":40,"what":"Holds each project across days and parks it at every approval until someone signs. The Final MVP fixes today's breaks: a send-back loops to the right step instead of failing, every station can ask questions, the finish is explicit, and a failed step restarts. During a build it starts a build worker for each piece and waits on it.","identity":"State machine role, Standard workflow","phase":"today","phaseText":"From today"},{"id":"ddb","name":"DynamoDB","sub":"projects, decisions, facts","zone":"ctl","x":352,"y":176,"w":124,"h":40,"what":"System of record for projects, signed decisions with signer and hash, confirmed facts and pointed resources. The Final MVP turns on point-in-time recovery and conditional writes.","identity":"Table policy per service","phase":"today","phaseText":"From today"},{"id":"s3","name":"S3","sub":"artifacts, corpus, evidence","zone":"ctl","x":492,"y":176,"w":130,"h":40,"what":"Artifacts, evidence and each project's corpus, passed by reference instead of copied into turns. Today the corpus is written and never read; in the Final MVP it feeds the project index.","identity":"KMS key per environment","phase":"today","phaseText":"From today"},{"id":"worker","name":"Build worker","sub":"Fargate, one per piece","zone":"ctl","x":28,"y":570,"w":116,"h":40,"what":"Step Functions starts one for each piece of the signed ntext agent that reads the recordings, files, tickets and pages people point at, and returns a digest with a locator for every statement. A file labeled above Internal is not indexed.","identity":"Microsoft 365 as the person who pointed; Jira and Confluence through an allowlisted service token","logo":"folder","role":"tl","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"reviewers","name":"Reviewers and QA","sub":"evidence agent, read-only","zone":"agt","x":268,"y":572,"w":142,"h":40,"what":"Brief critic, security and code review with a verifier, accessibility, the scope check and the evidence agent, which runs each acceptance criterion in the preview. The builder never grades its own work.","identity":"Read-only; a test viewer on the preview","role":"sl","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"gate","name":"Gate token","sub":"signed per approval","zone":"guard","x":32,"y":284,"w":104,"h":40,"what":"Issued when an approval is signed and bound to one project and step. It is the only key to creating a repository, pushing, filing in Jira and starting a build.","identity":"Signed by the approval service, checked by the broker","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"floor","name":"Write hook","sub":"the do-no-harm floor","zone":"guard","x":184,"y":284,"w":106,"h":40,"what":"A check on every tool call inside the agent's process that refuses any external write until the server has recorded the approval that allows it. Part of the two-week floor that keeps UA data and systems safe for pilot users.","identity":"Runs in the agent's process","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"traces","name":"Traces and cost","sub":"OpenTelemetry, CloudWatch","zone":"guard","x":312,"y":284,"w":142,"h":40,"what":"Every agent call and hand-off is a span with time, status and cost. It feeds the trace view, the decision timeline, and cost per turn and per project, shown from day one and not enforced.","identity":"Collector role","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"index","name":"Project index","sub":"Bedrock knowledge base","zone":"kn","x":650,"y":342,"w":128,"h":40,"what":"One managed knowledge base per project, fed from the S3 corpus and deleted with the project. Answers cite the page version, comment or timestamp.","identity":"Knowledge base id set by server state, never by the model","logo":"amazonbedrock","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"memory","name":"AgentCore Memory","sub":"conversation, per project","zone":"kn","x":650,"y":390,"w":128,"h":40,"what":"Conversation memory per project and person, and the short-term memory that lets a coding session survive a replaced microVM. Proposed facts wait here until a person confirms them.","identity":"Namespace per workspace and project","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"bedrock","name":"Amazon Bedrock","sub":"Claude models","zone":"kn","x":650,"y":438,"w":128,"h":40,"what":"Model calls for the orchestrator, specialists, reviewers and the coding agent. Today's four agents already call Claude Sonnet 5.5 here.","identity":"Runtime role","logo":"amazonbedrock","phase":"today","phaseText":"From today"},{"id":"cortex","name":"Cortex Code","sub":"data specialist, never rows","zone":"sf","x":350,"y":692,"w":132,"h":40,"what":"Today's Snowflake tool, re-scoped as the data specialist: it finds tables, profiles them, checks metrics against certified definitions and drafts queries inside Snowflake. It returns schema, counts, aggregates and query ids, never rows.","identity":"A dedicated service user with a grant-limited read-only role, replacing today's personal token","logo":"snowflake","role":"sk","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"semantic","name":"Semantic views","sub":"certified, golden reports","zone":"sf","x":350,"y":752,"w":132,"h":40,"what":"UA's certified semantic views and golden reports. Definitions stay in Snowflake; HyperDelivery adds no second semantic layer.","identity":"The workspace read role","logo":"snowflake","phase":"today","phaseText":"From today"},{"id":"repo","name":"Project repo","sub":"one branch, one PR","zone":"gh","x":8,"y":692,"w":150,"h":40,"what":"One repository per project in the prototype organization, and one pull request per build from hyperdelivery/<project> with a commit per piece. Nothing merges into a repository HyperDelivery did not create.","identity":"Pushed by the build worker with the organization token, never from the sandbox","logo":"github","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"actions","name":"Actions and scans","sub":"tests, CodeQL, secrets","zone":"gh","x":8,"y":752,"w":150,"h":40,"what":"Runs the tests and secret, dependency and code scanning on every pushed branch, outside the build session, then deploys the preview.","identity":"Repository workflows; no data credentials","logo":"github","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"coding","name":"Coding agent","sub":"AgentCore harness, in the sandbox","zone":"sb","x":180,"y":692,"w":146,"h":52,"what":"One harness session per project build, in a microVM in the sandbox account. It works through the signed plan piece by piece with the whole plan in its workspace, runs the tests and the preview build, and asks a person when two readings would build different things. One engine behind the Builder port.","identity":"Sandbox execution role; no GitHub credential; Git arrives and leaves as bundles","sl":["AgentCore harness,","in the sandbox"],"logo":"terminal","role":"vi","isNew":true,"phase":"mvp","phaseText":"New in the Final MVP"},{"id":"image","name":"Toolchain image","sub":"golden path, pinned","zone":"sb","x":180,"y":764,"w":146,"h":40,"what":"The container every session starts from: runtimes, test runners and linters, pinned by digest and rebuilt on the 7-day patch rule.",
