<style>

<script>
(function () {
  var root = document.currentScript.closest('.pv-dlc');
  if (!root) return;
  var box = root.querySelector('.dl-box');
  var btns = Array.prototype.slice.call(root.querySelectorAll('.dl-name'));
  function close(b) {
    b.setAttribute('aria-expanded', 'false');
    b.closest('tr').classList.remove('open');
    document.getElementById(b.getAttribute('aria-controls')).hidden = true;
  }
  function toggle(b) {
    var open = b.getAttribute('aria-expanded') !== 'true';
    btns.forEach(function (o) { if (o !== b) close(o); });
    if (!open) { close(b); return; }
    b.setAttribute('aria-expanded', 'true');
    b.closest('tr').classList.add('open');
    document.getElementById(b.getAttribute('aria-controls')).hidden = false;
  }
  btns.forEach(function (b, i) {
    b.addEventListener('click', function (ev) { ev.stopPropagation(); toggle(b); });
    b.addEventListener('keydown', function (ev) {
      var j = ev.key === 'ArrowDown' ? i + 1 : ev.key === 'ArrowUp' ? i - 1 : ev.key === 'Home' ? 0 : ev.key === 'End' ? btns.length - 1 : -2;
      if (j === -2 || j < 0 || j >= btns.length) return;
      ev.preventDefault();
      btns[j].focus();
    });
    b.closest('tr').addEventListener('click', function (ev) {
      if (ev.target.closest('a')) return;
      toggle(b);
    });
  });
  root.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    var open = btns.filter(function (b) { return b.getAttribute('aria-expanded') === 'true'; })[0];
    if (!open) return;
    close(open);
    open.focus();
  });
  function fit() {
    var scrolls = box.scrollWidth > box.clientWidth + 1;
    if (scrolls) { box.setAttribute('tabindex', '0'); } else { box.removeAttribute('tabindex'); }
  }
  fit();
  if (window.ResizeObserver) { new ResizeObserver(fit).observe(box); } else { window.addEventListener('resize', fit); }
})();
