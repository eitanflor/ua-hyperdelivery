[project]
name = "hyperdelivery-infra"
version = "0.1.0"
description = "AWS CDK infra for Hyperdelivery Phase 2 orchestration (Step Functions, DynamoDB, notifications)"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
