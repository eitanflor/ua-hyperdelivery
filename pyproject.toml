[project]
name = "hyperdelivery"
version = "0.1.0"
description = "Hyperdelivery agent - Strands Agents SDK on Bedrock, deployed on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.0",
    "bedrock-agentcore>=0.1",
    "boto3>=1.34",
    "awscrt>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "mcp>=1.29",
    "pypdf>=4.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # opentelemetry-api/-instrumentation come in via bedrock-agentcore, but without the SDK
    # its tracing hook silently no-ops against a ProxyTracerProvider.
    "opentelemetry-sdk>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "streamlit>=1.38",
    "requests>=2.32",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
