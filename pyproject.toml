[project]
name = "hyperdelivery"
version = "0.1.0"
description = "Hyperdelivery agent - Strands Agents SDK on Bedrock, deployed on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.0",
    "bedrock-agentcore>=0.1",
    "boto3>=1.34",
    "awscrt>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
