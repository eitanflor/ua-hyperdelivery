name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    name: format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups
          uv sync --frozen --all-groups --project infra

      # Deliberately the same script developers run locally, so a green `make check`
      # cannot disagree with a green CI run.
      - name: Run the precheck gate
        run: ./scripts/precheck.sh --ci

      # Renders as a table on the run's summary page - readable without downloading the
      # XML, which exists for coverage tooling rather than for people.
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
